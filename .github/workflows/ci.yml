name: Enterprise ERP CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-go-core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    - name: Build Core
      run: cd backend/core && go build -v ./...
    - name: Test Core
      run: cd backend/core && go test -v ./...

  build-python-ai:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd backend/ai
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests (stub)
      run: echo "No tests yet"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      run: cd frontend && npm ci
    - name: Build
      run: cd frontend && npm run build
